<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Icon Tiles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #090d16;
            color: #f8fafc;
            padding: 2rem 1.5rem;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 860px;
        }

        .social-tile {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-decoration: none;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .tile-glow {
            position: absolute;
            inset: 0;
            background: var(--brand-bg, var(--brand-color));
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: -1;
            transform: scale(0.85);
            border-radius: 24px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-box svg {
            width: 28px;
            height: 28px;
            fill: #94a3b8;
            transition: fill 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .brand-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f1f5f9;
            transition: color 0.3s ease;
        }

        .brand-handle {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .social-tile:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--brand-color);
            box-shadow: 0 20px 40px -10px var(--brand-glow);
        }

        .social-tile:hover .tile-glow {
            opacity: 0.12;
            transform: scale(1);
        }

        .social-tile:hover .icon-box {
            background: var(--brand-bg, var(--brand-color));
            border-color: var(--brand-color);
            transform: scale(1.1) rotate(-4deg);
            box-shadow: 0 10px 25px -4px var(--brand-glow);
        }

        .social-tile:hover .icon-box svg {
            fill: #ffffff;
            transform: scale(1.1);
        }

        .social-tile:hover .brand-name {
            color: #ffffff;
        }

        .social-tile:hover .brand-handle {
            color: var(--brand-color);
        }

        .social-tile:active {
            transform: translateY(-2px) scale(0.98);
        }

        .youtube {
            --brand-color: #ff0000;
            --brand-glow: rgba(255, 0, 0, 0.4);
        }

        .instagram {
            --brand-color: #e1306c;
            --brand-bg: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --brand-glow: rgba(225, 48, 108, 0.4);
        }

        .github {
            --brand-color: #2ea44f;
            --brand-glow: rgba(46, 164, 79, 0.4);
        }

        .linkedin {
            --brand-color: #0a66c2;
            --brand-glow: rgba(10, 102, 194, 0.4);
        }

        @media (max-width: 768px) {
            .social-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .social-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Connect With Us</h1>
        <p>Interactive brand tiles for YouTube, Instagram, GitHub & LinkedIn</p>
    </header>

    <main class="social-grid">
        <a href="https://youtube.com" target="_blank" class="social-tile youtube">
            <div class="tile-glow"></div>
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>
            <div class="brand-info">
                <span class="brand-name">YouTube</span>
                <span class="brand-handle">@channel</span>
            </div>
        </a>

            <div class="icon-box">

            </div>

                <span class="brand-handle">@username</span>
            </div>
        </a>

        <a href="https://github.com" target="_blank" class="social-tile github">
            <div class="tile-glow"></div>
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            </div>
            <div class="brand-info">
                <span class="brand-name">GitHub</span>
                <span class="brand-handle">@developer</span>
            </div>
        </a>

        <a href="https://linkedin.com" target="_blank" class="social-tile linkedin">
            <div class="tile-glow"></div>
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </div>
            <div class="brand-info">
                <span class="brand-name">LinkedIn</span>
                <span class="brand-handle">in/profile</span>
            </div>
        </a>
    </main>

</body>
</html>
