<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth System - Login & OTP</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 100%);
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary-accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.15);
      --glass-blur: blur(16px);
    }

    [data-theme="cyber"] {
      --bg-gradient: radial-gradient(circle at 80% 20%, #2e1065 0%, #030712 100%);
      --card-bg: rgba(3, 7, 18, 0.85);
      --card-border: rgba(236, 72, 153, 0.3);
      --primary-accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.5);
      --text-main: #fdf2f8;
      --text-sub: #f472b6;
      --input-bg: rgba(236, 72, 153, 0.05);
      --input-border: rgba(236, 72, 153, 0.25);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.9);
      --primary-accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.25);
      --text-main: #1e1b4b;
      --text-sub: #6366f1;
      --input-bg: rgba(255, 255, 255, 0.9);
      --input-border: rgba(199, 210, 254, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    .theme-bar {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      padding: 0.4rem;
      border-radius: 30px;
      margin-bottom: 2rem;
      z-index: 10;
    }

    .theme-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .theme-btn.active {
      background: var(--primary-accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .perspective-wrapper {
      perspective: 1200px;
      width: 100%;
      max-width: 400px;
    }

    .card-flipper {
      width: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-flipper.login-mode {
      transform: rotateY(0deg);
    }

    .card-flipper.otp-mode {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), 0 0 20px var(--accent-glow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      position: relative;
      transform: rotateY(0deg);
    }

    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      transform: rotateY(180deg);
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-header h2 {
      color: var(--text-main);
      font-size: 1.75rem;
      font-weight: 700;
    }

    .form-header p {
      color: var(--text-sub);
      font-size: 0.875rem;
      margin-top: 0.4rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-group label {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 0.9rem;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: 0;
      font-size: 0.75rem;
      padding: 0 0.4rem;
      background: var(--primary-accent);
      color: #fff;
      border-radius: 4px;
    }

    .input-group input:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary-accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .mode-switch-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }

    .mode-switch-links a {
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .mode-switch-links a:hover {
      color: var(--primary-accent);
    }

    .otp-inputs {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin: 1.5rem 0;
    }

    .otp-inputs input {
      width: 52px;
      height: 56px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 12px;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('dark', this)">Midnight</button>
    <button class="theme-btn" onclick="setTheme('cyber', this)">Cyber Neon</button>
    <button class="theme-btn" onclick="setTheme('light', this)">Clean Light</button>
  </div>

  <div class="perspective-wrapper">
    <div class="card-flipper login-mode" id="cardFlipper">
      
      <div class="card-face card-front">
        <div class="form-header">
          <h2>Welcome Back</h2>
          <p>Sign in to continue your session</p>
        </div>
        <form onsubmit="handleAuth(event)">
          <div class="input-group">
            <input type="email" placeholder=" " required />
            <label>Email Address</label>
          </div>
          <div class="input-group">
            <input type="password" placeholder=" " required />
            <label>Password</label>
          </div>
          <button type="submit" class="btn-submit">Sign In</button>
        </form>
        <div class="mode-switch-links">
          <a onclick="setMode('otp')">Use Quick OTP Login →</a>
        </div>
      </div>

      <div class="card-face card-back">
        <div class="form-header">
          <h2>Passkey Code</h2>
          <p>Enter 4-digit code sent to your phone</p>
        </div>
        <form onsubmit="handleAuth(event)">
          <div class="otp-inputs">
            <div class="input-group"><input type="text" maxlength="1" onkeyup="moveNext(this)" required /></div>
            <div class="input-group"><input type="text" maxlength="1" onkeyup="moveNext(this)" required /></div>
            <div class="input-group"><input type="text" maxlength="1" onkeyup="moveNext(this)" required /></div>
            <div class="input-group"><input type="text" maxlength="1" onkeyup="moveNext(this)" required /></div>
          </div>
          <button type="submit" class="btn-submit">Verify & Sign In</button>
        </form>
        <div class="mode-switch-links">
          <a onclick="setMode('login')">← Return to Email Login</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    const flipper = document.getElementById('cardFlipper');

    function setTheme(theme, btn) {
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function setMode(mode) {
      flipper.className = 'card-flipper ' + mode + '-mode';
    }

    function moveNext(elem) {
      if (elem.value.length === 1 && elem.parentElement.nextElementSibling) {
        const nextInput = elem.parentElement.nextElementSibling.querySelector('input');
        if (nextInput) nextInput.focus();
      }
    }

    function handleAuth(e) {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-submit');
      const originalText = btn.innerText;
      btn.innerText = 'Verifying...';
      btn.style.opacity = '0.7';

      setTimeout(() => {
        btn.innerText = '✓ Success!';
        btn.style.background = '#10b981';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = 'var(--primary-accent)';
          btn.style.opacity = '1';
        }, 2000);
      }, 1000);
    }
  </script>
</body>
</html>
