<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Animated Rings</title>
    <style>
        body {
            background-color: #161618;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .ring-container {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .ring:nth-child(1) {
            border-radius: 41% 59% 49% 51% / 54% 48% 52% 46%;
            animation: rotateRing 6s linear infinite;
        }

        .ring:nth-child(2) {
            border-radius: 58% 42% 54% 46% / 47% 55% 45% 53%;
            animation: rotateRing 8s linear infinite reverse;
        }

        .ring:nth-child(3) {
            border-radius: 48% 52% 43% 57% / 51% 43% 57% 49%;
            animation: rotateRing 10s linear infinite;
        }

        .ring-container:hover .ring:nth-child(1) {
            border-color: #ff2a75;
            box-shadow: 0 0 20px rgba(255, 42, 117, 0.6), inset 0 0 15px rgba(255, 42, 117, 0.4);
        }

        .ring-container:hover .ring:nth-child(2) {
            border-color: #55ff55;
            box-shadow: 0 0 20px rgba(85, 255, 85, 0.6), inset 0 0 15px rgba(85, 255, 85, 0.4);
        }

        .ring-container:hover .ring:nth-child(3) {
            border-color: #ffdf00;
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.6), inset 0 0 15px rgba(255, 223, 0, 0.4);
        }

        @keyframes rotateRing {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="ring-container">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

</body>
</html>
