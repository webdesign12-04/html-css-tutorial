<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Independence Day Card</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --saffron: #FF9933;
      --white: #FFFFFF;
      --green: #138808;
      --navy-blue: #000080;
      --deep-navy: #0e2040;
      --gold-border: #d4af37;
      --bg-cream: #faf7f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    .confetti-rain-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .rain-confetti {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 14px;
      opacity: 0.8;
      border-radius: 2px;
      animation: fall 4s linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }

    .card-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 660px;
      background: var(--bg-cream);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 153, 51, 0.25);
      border: 3px solid var(--gold-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    }

    .card-container:hover {
      transform: translateY(-8px) scale(1.02) rotateX(2deg);
      box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.6), 0 0 35px rgba(255, 153, 51, 0.4);
    }

    .inner-border {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 10px;
      pointer-events: none;
      z-index: 10;
    }

    .top-watercolor {
      position: absolute;
      top: -15px;
      left: -15px;
      width: 220px;
      height: 125px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.9;
      animation: pulseWave 5s ease-in-out infinite alternate;
    }

    @keyframes pulseWave {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .bunting {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 135px;
      z-index: 12;
      transform-origin: top right;
      animation: swayBunting 3.5s ease-in-out infinite alternate;
    }

    @keyframes swayBunting {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-4deg); }
    }

    .birds-group {
      position: absolute;
      top: 310px;
      right: 18px;
      z-index: 12;
    }

    .bird {
      position: absolute;
      animation: floatBird 2.5s ease-in-out infinite alternate;
    }

    .bird.saffron { top: -15px; right: 10px; animation-delay: 0s; }
    .bird.white { top: -2px; right: 30px; animation-delay: 0.4s; }
    .bird.green { top: 10px; right: 0px; animation-delay: 0.8s; }

    @keyframes floatBird {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-7px) scale(1.05); }
    }

    .content {
      position: relative;
      z-index: 11;
      width: 100%;
      margin-top: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 1.2rem;
    }

    .happy-title-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .line-stripe {
      height: 3px;
      width: 38px;
      border-radius: 2px;
      background: linear-gradient(to right, var(--saffron), var(--white), var(--green));
    }

    .happy-text {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--saffron);
      letter-spacing: 5px;
    }

    .independence-text {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: var(--deep-navy);
      line-height: 1.05;
      margin: 4px 0 2px 0;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.08);
      animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
      opacity: 0;
    }

    .day-title-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
      opacity: 0;
    }

    .day-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 6px;
    }

    .center-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    .divider-line {
      width: 55px;
      height: 1.5px;
      background: rgba(0, 0, 128, 0.3);
    }

    .chakra-mini {
      width: 20px;
      height: 20px;
      animation: spinChakra 12s linear infinite;
    }

    .sub-heading {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy-blue);
      letter-spacing: 1.5px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .stars-divider {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .star { font-size: 0.8rem; }
    .star.saffron { color: var(--saffron); }
    .star.navy { color: var(--navy-blue); }
    .star.green { color: var(--green); }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: #334155;
      max-width: 90%;
      line-height: 1.45;
      font-weight: 500;
    }

    .click-hint {
      position: absolute;
      top: 15px;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.4);
      font-weight: 700;
      animation: pulseHint 2s infinite alternate;
    }

    @keyframes pulseHint {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }

    .bottom-graphics {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      pointer-events: none;
      z-index: 5;
    }

    .red-fort-svg {
      position: absolute;
      bottom: 0;
      left: 5px;
      width: 140px;
      opacity: 0.95;
      z-index: 6;
    }

    .india-gate-svg {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-25%);
      width: 110px;
      opacity: 0.22;
      z-index: 4;
    }

    .flag-container {
      position: absolute;
      bottom: 25px;
      left: 10px;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .flag-pole {
      width: 3px;
      height: 105px;
      background: linear-gradient(to right, #ccc, #fff, #999);
      border-radius: 2px;
      position: relative;
    }

    .flag-pole::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -2.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4af37;
    }

    .waving-flag {
      position: absolute;
      top: 0;
      left: 3px;
      width: 65px;
      height: 42px;
      transform-origin: left center;
      animation: waveFlag 2s ease-in-out infinite alternate;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    @keyframes waveFlag {
      0% { transform: skewY(0deg) scaleY(1); }
      50% { transform: skewY(4deg) scaleY(1.02); }
      100% { transform: skewY(-4deg) scaleY(0.98); }
    }

    .bottom-watercolor {
      position: absolute;
      bottom: -5px;
      right: -15px;
      width: 290px;
      height: 130px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.95;
    }

    .large-chakra {
      position: absolute;
      bottom: -5px;
      right: 8px;
      width: 68px;
      height: 68px;
      z-index: 7;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
      animation: spinChakra 15s linear infinite;
    }

    @keyframes spinChakra {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 2px;
      z-index: 30;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="confetti-rain-container" id="confettiRain"></div>

  <div class="card-container" id="card">
    <div class="inner-border"></div>
    <div class="click-hint">✨ Click for Celebration ✨</div>

    <svg class="top-watercolor" viewBox="0 0 300 200" fill="none">
      <path d="M-20 -20 C 100 -10, 220 30, 260 90 C 290 140, 200 180, 140 160 C 80 140, -10 180, -20 200 Z" fill="url(#saffronGrad)" opacity="0.85"/>
      <path d="M-20 -20 C 80 -20, 180 20, 220 70 C 250 110, 160 140, 100 130 C 50 120, -10 140, -20 160 Z" fill="#FFFFFF" opacity="0.6"/>
      <path d="M-20 -20 C 60 -30, 140 10, 180 50 C 200 80, 130 110, 70 100 C 20 90, -10 100, -20 120 Z" fill="url(#greenGrad)" opacity="0.85"/>
      <defs>
        <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF9933" />
          <stop offset="100%" stop-color="#FFB366" />
        </linearGradient>
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#138808" />
          <stop offset="100%" stop-color="#2ebd1c" />
        </linearGradient>
      </defs>
    </svg>

    <svg class="bunting" viewBox="0 0 200 80" fill="none">
      <path d="M 0 0 Q 100 40 200 10" stroke="#d4af37" stroke-width="1.5" fill="none"/>
      <polygon points="20,4 32,4 26,22" fill="#FF9933" />
      <polygon points="50,11 62,11 56,32" fill="#138808" />
      <polygon points="80,17 92,17 86,38" fill="#FFFFFF" stroke="#ddd" stroke-width="0.5"/>
      <polygon points="110,20 122,20 116,40" fill="#FF9933" />
      <polygon points="140,19 152,19 146,38" fill="#138808" />
    </svg>

    <div class="birds-group">
      <svg class="bird saffron" width="18" height="15" viewBox="0 0 24 24" fill="#FF9933">
        <path d="M21.5 4.5C18 7.5 13 8.5 9 7.5C6 10.5 3 11 0 11C4 13 8 13 12 11.5C16 14.5 20 15 24 14C22 11 21 8 21.5 4.5Z"/>
      </svg>
      <svg class="bird white" width="15" height="12" viewBox="0 0 24 24" fill="#cccccc">
        <path d="M21.5 4.5C18 7.5 13 8.5 9 7.5C6 10.5 3 11 0 11C4 13 8 13 12 11.5C16 14.5 20 15 24 14C22 11 21 8 21.5 4.5Z"/>
      </svg>
      <svg class="bird green" width="20" height="16" viewBox="0 0 24 24" fill="#138808">
        <path d="M21.5 4.5C18 7.5 13 8.5 9 7.5C6 10.5 3 11 0 11C4 13 8 13 12 11.5C16 14.5 20 15 24 14C22 11 21 8 21.5 4.5Z"/>
      </svg>
    </div>

    <div class="content">
      <div class="happy-title-wrapper">
        <div class="line-stripe"></div>
        <span class="happy-text">HAPPY</span>
        <div class="line-stripe"></div>
      </div>

      <h1 class="independence-text">Independence</h1>

      <div class="day-title-wrapper">
        <div class="line-stripe"></div>
        <span class="day-text">DAY</span>
        <div class="line-stripe"></div>
      </div>

      <div class="center-divider">
        <div class="divider-line"></div>
        <svg class="chakra-mini" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#000080" stroke-width="4"/>
          <circle cx="50" cy="50" r="8" fill="#000080"/>
          <g stroke="#000080" stroke-width="2">
            <line x1="50" y1="50" x2="50" y2="4"/><line x1="50" y1="50" x2="50" y2="96"/>
            <line x1="50" y1="50" x2="4" y2="50"/><line x1="50" y1="50" x2="96" y2="50"/>
            <line x1="50" y1="50" x2="17.5" y2="17.5"/><line x1="50" y1="50" x2="82.5" y2="82.5"/>
            <line x1="50" y1="50" x2="82.5" y2="17.5"/><line x1="50" y1="50" x2="17.5" y2="82.5"/>
          </g>
        </svg>
        <div class="divider-line"></div>
      </div>

      <p class="sub-heading">
        PROUD TO BE INDIAN<br>
        PROUD OF OUR NATION
      </p>

      <div class="stars-divider">
        <span class="star saffron">★</span>
        <span class="star navy">★</span>
        <span class="star green">★</span>
      </div>

      <p class="quote-text">
        “Freedom in our minds, faith in our words, pride in our hearts, and memories in our souls.”
      </p>
    </div>

    <div class="bottom-graphics">
      <div class="flag-container">
        <div class="flag-pole"></div>
        <svg class="waving-flag" viewBox="0 0 120 80" preserveAspectRatio="none">
          <rect x="0" y="0" width="120" height="26.6" fill="#FF9933" />
          <rect x="0" y="26.6" width="120" height="26.6" fill="#FFFFFF" />
          <rect x="0" y="53.2" width="120" height="26.8" fill="#138808" />
          <circle cx="60" cy="40" r="11" fill="none" stroke="#000080" stroke-width="1.5"/>
          <circle cx="60" cy="40" r="2" fill="#000080"/>
        </svg>
      </div>

      <svg class="red-fort-svg" viewBox="0 0 260 160" fill="none">
        <path d="M 10 160 L 10 120 L 25 120 L 25 110 L 35 110 L 35 120 L 50 120 L 50 90 Q 60 70 70 90 L 70 120 L 85 120 L 85 100 L 175 100 L 175 120 L 190 120 L 190 90 Q 200 70 210 90 L 210 120 L 225 120 L 225 110 L 235 110 L 235 120 L 250 120 L 250 160 Z" fill="#a54a36" opacity="0.85"/>
        <path d="M 85 100 L 85 70 Q 130 50 175 70 L 175 100 Z" fill="#8c3a2a"/>
        <path d="M 52 90 Q 60 72 68 90 Z" fill="#7a3022"/>
        <path d="M 192 90 Q 200 72 208 90 Z" fill="#7a3022"/>
        <path d="M 120 70 Q 130 52 140 70 Z" fill="#7a3022"/>
        <line x1="130" y1="52" x2="130" y2="38" stroke="#333" stroke-width="1"/>
        <polygon points="130,38 140,41 130,44" fill="#FF9933"/>
      </svg>

      <svg class="india-gate-svg" viewBox="0 0 200 200" fill="#94a3b8">
        <path d="M 40 200 L 40 60 L 30 60 L 30 45 L 170 45 L 170 60 L 160 60 L 160 200 L 130 200 L 130 110 Q 100 80 70 110 L 70 200 Z"/>
        <rect x="50" y="25" width="100" height="15" rx="2"/>
      </svg>

      <svg class="bottom-watercolor" viewBox="0 0 400 200" preserveAspectRatio="none">
        <path d="M 0 160 C 120 130, 220 70, 420 10 L 420 220 L 0 220 Z" fill="#138808"/>
        <path d="M 0 140 C 130 110, 230 50, 420 -10 L 420 180 C 220 80, 120 140, 0 170 Z" fill="#FFFFFF"/>
        <path d="M 0 120 C 140 90, 240 30, 420 -30 L 420 150 C 230 60, 130 120, 0 150 Z" fill="#FF9933"/>
      </svg>

      <svg class="large-chakra" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#000080" stroke-width="5"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="#000080" stroke-width="2"/>
        <circle cx="50" cy="50" r="9" fill="#000080"/>
        <g stroke="#000080" stroke-width="2">
          <line x1="50" y1="50" x2="50" y2="8"/><line x1="50" y1="50" x2="50" y2="92"/>
          <line x1="50" y1="50" x2="8" y2="50"/><line x1="50" y1="50" x2="92" y2="50"/>
          <line x1="50" y1="50" x2="20" y2="20"/><line x1="50" y1="50" x2="80" y2="80"/>
          <line x1="50" y1="50" x2="80" y2="20"/><line x1="50" y1="50" x2="20" y2="80"/>
        </g>
      </svg>
    </div>
  </div>

  <script>
    const tricolor = ['#FF9933', '#FFFFFF', '#138808', '#000080', '#FFD700'];

    const rainContainer = document.getElementById('confettiRain');
    for (let i = 0; i < 35; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'rain-confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = tricolor[Math.floor(Math.random() * tricolor.length)];
      confetti.style.animationDelay = Math.random() * 4 + 's';
      confetti.style.animationDuration = 3 + Math.random() * 3 + 's';
      rainContainer.appendChild(confetti);
    }

    const card = document.getElementById('card');
    card.addEventListener('click', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        const color = tricolor[Math.floor(Math.random() * tricolor.length)];
        particle.style.backgroundColor = color;
        particle.style.width = (6 + Math.random() * 6) + 'px';
        particle.style.height = (8 + Math.random() * 8) + 'px';

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';

        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 120;
        const tx = Math.cos(angle) * speed + 'px';
        const ty = Math.sin(angle) * speed + 'px';

        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);

        card.appendChild(particle);

        setTimeout(() => particle.remove(), 1000);
      }
    });
  </script>

</body>
</html>
