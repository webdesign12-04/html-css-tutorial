<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanuman Ansh - 3D Movie Ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-image: radial-gradient(circle at center, #151520 0%, #050505 100%);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            perspective: 1200px;
        }

        .ticket-container {
            display: flex;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            transform-style: preserve-3d;
        }

        .ticket-container:hover {
            transform: translateY(-10px) rotateX(10deg) rotateZ(-2deg);
        }

        .ticket-container:hover .ticket-right {
            transform: rotateY(-35deg);
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.8);
        }

        .ticket-left {
            position: relative;
            width: 380px;
            height: 200px;
            background: 
                linear-gradient(to right, rgba(10, 10, 15, 0.9) 0%, rgba(10, 10, 15, 0.3) 100%),
                url('download.jpg') center/cover no-repeat;
            border: 2px solid rgba(255, 170, 0, 0.5);
            border-right: none;
            border-radius: 16px 0 0 16px;
            padding: 25px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .ticket-right {
            position: relative;
            width: 140px;
            height: 200px;
            background: linear-gradient(135deg, #12131c, #0a0a0f);
            border: 2px solid rgba(255, 170, 0, 0.5);
            border-left: 2px dashed rgba(255, 170, 0, 0.6);
            border-radius: 0 16px 16px 0;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transform-origin: left center;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .cutout-top, .cutout-bottom {
            position: absolute;
            left: -16px;
            width: 30px;
            height: 30px;
            background-color: #050505;
            border-radius: 50%;
            border: 2px solid rgba(255, 170, 0, 0.5);
            z-index: 5;
        }

        .cutout-top {
            top: -16px;
            border-top-color: transparent;
            border-left-color: transparent;
            transform: rotate(45deg);
        }

        .cutout-bottom {
            bottom: -16px;
            border-bottom-color: transparent;
            border-left-color: transparent;
            transform: rotate(-45deg);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .cinema-name {
            color: #fce205; 
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .rating {
            background: #ffaa00;
            color: #000;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .movie-title {
            font-family: 'Teko', sans-serif;
            font-size: 46px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(90deg, #ffaa00, #ffeb3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.9)); 
        }

        .details {
            display: flex;
            gap: 30px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 3px;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .info-value {
            color: #ffaa00; 
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .ticket-right .info-block {
            align-items: center;
        }

        .ticket-right .info-value {
            color: #ff3366;
            font-size: 24px;
            font-weight: bold;
            text-shadow: none;
        }

        .barcode {
            width: 10px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.8) 0,
                rgba(255,255,255,0.8) 2px,
                transparent 2px,
                transparent 5px,
                rgba(255,255,255,0.8) 5px,
                rgba(255,255,255,0.8) 6px,
                transparent 6px,
                transparent 9px,
                rgba(255,255,255,0.8) 9px,
                rgba(255,255,255,0.8) 13px,
                transparent 13px,
                transparent 15px
            );
            position: absolute;
            right: 15px;
            top: 0;
            opacity: 0.5;
        }

        .barcode-horizontal {
            width: 100%;
            height: 40px;
            background: repeating-linear-gradient(
                to right,
                #fff 0,
                #fff 2px,
                transparent 2px,
                transparent 5px,
                #fff 5px,
                #fff 6px,
                transparent 6px,
                transparent 9px,
                #fff 9px,
                #fff 13px,
                transparent 13px,
                transparent 15px
            );
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="ticket-container">
        
        <div class="ticket-left">
            <div class="barcode"></div>
            
            <div class="header">
                <div class="cinema-name">PVR CINEMAS</div>
                <div class="rating">U/A</div>
            </div>

            <div class="movie-title">HANUMAN ANSH</div>

            <div class="details">
                <div class="info-block">
                    <span class="info-label">Date</span>
                    <span class="info-value">OCT 12</span>
                </div>
                <div class="info-block">
                    <span class="info-label">Time</span>
                    <span class="info-value">18:45</span>
                </div>
                <div class="info-block">
                    <span class="info-label">Screen</span>
                    <span class="info-value">02-3D</span>
                </div>
            </div>
        </div>

        <div class="ticket-right">
            <div class="cutout-top"></div>
            <div class="cutout-bottom"></div>

            <div class="info-block">
                <span class="info-label">Seat</span>
                <span class="info-value">G-18</span>
            </div>

            <div class="barcode-horizontal"></div>

            <div class="info-block">
                <span class="info-label">Admit</span>
                <span class="info-value" style="font-size: 14px; color: #fff;">ONE</span>
            </div>
        </div>

    </div>

</body>
</html>
