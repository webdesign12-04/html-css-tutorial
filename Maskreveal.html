<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mask Reveal Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            color: #f8fafc;
            padding: 1.5rem;
            overflow: hidden;
        }

        .reveal-card {
            width: 100%;
            max-width: 650px;
            height: 400px;
            border-radius: 24px;
            position: relative;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        .layer-base {
            position: absolute;
            inset: 0;
            padding: 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #0f172a;
            color: #64748b;
            z-index: 1;
        }

        .layer-base h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #334155;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .layer-base p {
            font-size: 1.1rem;
            max-width: 440px;
            line-height: 1.5;
        }

        .layer-reveal {
            position: absolute;
            inset: 0;
            padding: 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            color: #ffffff;
            z-index: 2;
            pointer-events: none;
            clip-path: circle(var(--mask-size, 0px) at var(--mask-x, 50%) var(--mask-y, 50%));
            transition: clip-path 0.1s ease-out;
        }

        .layer-reveal h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 1rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .layer-reveal p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 440px;
            line-height: 1.5;
        }

        .hint-badge {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            z-index: 3;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <main class="reveal-card" id="card">
        <div class="layer-base">
            <h1>Hidden Potential</h1>
            <p>Hover over this canvas to spotlight the hidden vibrant layer beneath the dark surface mask.</p>
        </div>

        <div class="layer-reveal" id="reveal-layer">
            <h1>Unleash Creativity</h1>
            <p>Dynamic CSS clip-path masking lets you build smooth interactive spotlight reveal effects effortlessly.</p>
        </div>

        <div class="hint-badge">💡 Move cursor over card</div>
    </main>

    <script>
        const card = document.getElementById('card');
        const revealLayer = document.getElementById('reveal-layer');
        const spotlightRadius = 140;

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            revealLayer.style.setProperty('--mask-x', `${x}px`);
            revealLayer.style.setProperty('--mask-y', `${y}px`);
            revealLayer.style.setProperty('--mask-size', `${spotlightRadius}px`);
        });

        card.addEventListener('mouseleave', () => {
            revealLayer.style.setProperty('--mask-size', `0px`);
        });
    </script>
</body>
</html>
